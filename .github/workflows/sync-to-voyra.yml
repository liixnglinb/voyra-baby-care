name: Sync to Voyra

# 本仓库 push 后，把 宝宝护理 代码自动同步进 Voyra 主仓库并触发部署
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout voyra-baby-care
        uses: actions/checkout@v4

      - name: Checkout Voyra main repo
        uses: actions/checkout@v4
        with:
          repository: liixnglinb/Voyra
          token: ${{ secrets.VOYRA_SYNC_TOKEN }}
          path: voyra

      - name: Sync files
        run: |
          cp "src/pages/BabyCare.jsx" "voyra/src/pages/BabyCare.jsx"
          cp "src/pages/babycare-modules.jsx" "voyra/src/pages/babycare-modules.jsx"
          cp "src/components/TrendChart.jsx" "voyra/src/components/TrendChart.jsx"

      - name: Commit & push to Voyra
        run: |
          cd voyra
          git config user.name "voyra-baby-care-sync[bot]"
          git config user.email "liixnglinb@users.noreply.github.com"
          git add src/pages/BabyCare.jsx src/pages/babycare-modules.jsx src/components/TrendChart.jsx
          if git diff --cached --quiet; then
            echo "无代码变更，跳过提交"
            exit 0
          fi
          git commit -m "chore(voyra-baby-care): 自动同步自 voyra-baby-care ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

